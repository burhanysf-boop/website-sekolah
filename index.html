<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SMA Negeri 5 Makassar</title>
  <meta name="description" content="Website resmi SMA Negeri 5 Makassar - Visi, Misi, dan Portal Layanan">
  <link rel="icon" type="image/png" href="https://iili.io/FYaqxfV.th.png">
  <style>
    :root {
      --primary: #1e3a5f;
      --primary-light: #2c5282;
      --accent: #d69e2e;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #2d3748;
      --muted: #718096;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* HEADER */
    header.site-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .nav-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 48px; height: 48px; border-radius: 50%;
      background: #fff; object-fit: cover;
      padding: 2px;
    }
    .brand-text strong { display: block; font-size: 17px; }
    .brand-text span { font-size: 13px; opacity: 0.85; }
    nav a {
      color: #fff; margin-left: 18px; font-size: 14px; opacity: 0.9;
    }
    nav a:hover { opacity: 1; text-decoration: underline; }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      text-align: center;
      padding: 70px 20px 80px;
    }
    .hero img.hero-logo {
      width: 96px; height: 96px; border-radius: 50%;
      background: #fff; padding: 4px; margin-bottom: 14px;
    }
    .hero h1 { font-size: 36px; margin-bottom: 8px; }
    .hero .slogan {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 18px;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .hero p { margin-top: 14px; opacity: 0.9; }

    main { max-width: 1100px; margin: -40px auto 0; padding: 0 20px 60px; }
    section {
      background: var(--card);
      border-radius: 14px;
      padding: 32px;
      margin-bottom: 28px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    section h2 {
      color: var(--primary);
      font-size: 24px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 3px solid var(--accent);
      display: inline-block;
    }
    .vision-text {
      font-style: italic;
      font-size: 18px;
      background: #fdf8ec;
      border-left: 5px solid var(--accent);
      padding: 18px 22px;
      border-radius: 8px;
      margin-top: 14px;
    }
    .mission-list {
      list-style: none;
      counter-reset: misi;
      margin-top: 14px;
    }
    .mission-list li {
      counter-increment: misi;
      position: relative;
      padding: 12px 14px 12px 56px;
      border-bottom: 1px solid var(--border);
    }
    .mission-list li:last-child { border-bottom: none; }
    .mission-list li::before {
      content: counter(misi);
      position: absolute;
      left: 12px; top: 12px;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    /* PORTAL GRID */
    .portal-group { margin-top: 20px; }
    .portal-group h3 {
      font-size: 16px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(30,58,95,0.12);
      border-color: var(--primary-light);
    }
    .card .icon { font-size: 26px; }
    .card h4 { color: var(--primary); font-size: 16px; }
    .card p { color: var(--muted); font-size: 13px; }
    .card .open {
      margin-top: auto;
      padding-top: 8px;
      color: var(--primary-light);
      font-size: 13px;
      font-weight: 600;
    }
    .notice {
      font-size: 13px;
      color: var(--muted);
      margin-top: 16px;
    }

    footer.site-footer {
      background: var(--primary);
      color: #cbd5e0;
      text-align: center;
      padding: 24px 20px;
      font-size: 14px;
    }
    footer.site-footer strong { color: #fff; }
